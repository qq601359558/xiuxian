<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>天道因果录 · 工作台</title>
  <meta name="description" content="局域网修仙模拟工作台" />
  <link rel="stylesheet" href="workbench.css" />
</head>
<body>
  <!-- 入世 -->
  <div id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-hero">
        <div class="gate-seal">道</div>
        <h1>天道因果录</h1>
        <p>局域网修仙模拟 · 工作台</p>
      </div>
      <div class="gate-body">
        <div class="gate-tabs">
          <button type="button" class="tab active" data-mode="login">登录</button>
          <button type="button" class="tab" data-mode="register">注册</button>
        </div>
        <form id="gateForm" autocomplete="on">
          <div class="field">
            <label for="fUser">账号</label>
            <input id="fUser" type="text" autocomplete="username" required maxlength="32" placeholder="例如 demo" />
          </div>
          <div class="field hidden" id="fNameWrap">
            <label for="fName">道号</label>
            <input id="fName" type="text" maxlength="12" placeholder="入世名号" />
          </div>
          <div class="field">
            <label for="fPass">口令</label>
            <input id="fPass" type="password" autocomplete="current-password" required maxlength="64" />
          </div>
          <div class="field">
            <label for="fServer">服务器</label>
            <input id="fServer" type="text" placeholder="http://127.0.0.1:8765" spellcheck="false" />
          </div>
          <div id="gateMsg" class="gate-msg" role="alert"></div>
          <div class="gate-actions">
            <button type="submit" class="btn primary block" id="gateSubmit">进入大世界</button>
            <button type="button" class="btn ghost block" id="btnProbe">检测服务器</button>
            <button type="button" class="btn ghost block" id="btnDemo">离线演示</button>
          </div>
        </form>
        <div class="gate-foot">
          开服：`python -m server.run` 后访问<br />
          <code>http://127.0.0.1:8765/</code>
        </div>
      </div>
    </div>
  </div>

  <!-- 工作台 -->
  <div id="app" class="app hidden">
    <nav class="rail" aria-label="主导航">
      <div class="rail-mark" title="天道因果录">道</div>
      <button type="button" class="rail-btn" data-view="tasks" title="任务" aria-label="任务">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      </button>
      <button type="button" class="rail-btn active" data-view="here" title="同场" aria-label="同场">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M16 11a4 4 0 10-8 0"/><path d="M4 20a8 8 0 0116 0"/></svg>
      </button>
      <button type="button" class="rail-btn" data-view="world" title="世界" aria-label="世界">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
      </button>
      <button type="button" class="rail-btn" data-view="feed" title="动态" aria-label="动态">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h12M4 18h8"/></svg>
      </button>
      <div class="rail-spacer"></div>
      <button type="button" class="rail-btn" id="btnNav" title="迁跃" aria-label="迁跃">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg>
      </button>
      <button type="button" class="rail-btn" id="btnTheme" title="主题" aria-label="切换主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2"/></svg>
      </button>
      <button type="button" class="rail-btn" id="btnHelp" title="敕令" aria-label="敕令帮助">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.7.5-1.5 1.2-1.5 2.5M12 17v.01"/></svg>
      </button>
      <button type="button" class="rail-btn" id="btnLogout" title="暂离" aria-label="暂离">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 6H6a2 2 0 00-2 2v8a2 2 0 002 2h4M14 16l4-4-4-4M18 12H9"/></svg>
      </button>
    </nav>

    <div class="workspace">
      <div class="topbar">
        <div class="topbar-brand">天道因果录<span>工作台</span></div>
        <div class="topbar-spacer"></div>
        <div class="conn" id="connPill">
          <span class="dot" id="connDot"></span>
          <span id="connText">未连接</span>
        </div>
      </div>

      <div class="offline" id="offlineBar">
        <span>网络或服务器不可用 · 可重试或离线演示</span>
        <button type="button" class="btn sm" id="btnRetry">重试</button>
      </div>

      <div class="dial" id="dial" aria-label="天道盘">
        <div class="dial-cell"><div class="k">道号</div><div class="v gold" id="dName">—</div><div class="s" id="dSect">散修</div></div>
        <div class="dial-cell"><div class="k">境界</div><div class="v" id="dRealm">—</div><div class="s" id="dExp">—</div></div>
        <div class="dial-cell"><div class="k">位置</div><div class="v" id="dLoc" style="font-family:var(--font-ui);font-size:13px">—</div><div class="s" id="dSafe">—</div></div>
        <div class="dial-cell"><div class="k">寿元</div><div class="v" id="dLife">—</div><div class="s">岁</div></div>
        <div class="dial-cell"><div class="k">灵石</div><div class="v gold" id="dStones">—</div><div class="s" id="dVault">金库 —</div></div>
        <div class="dial-cell"><div class="k">业力 / 功德</div><div class="v" id="dKarma">—</div><div class="s" id="dBlood">—</div></div>
        <div class="dial-cell"><div class="k">世界</div><div class="v" id="dWorld" style="font-family:var(--font-ui);font-size:13px">—</div><div class="s" id="dWorldSub">天道态势</div></div>
      </div>

      <div class="split">
        <aside class="sidebar" id="sidebar" aria-label="迁跃">
          <div class="sidebar-head">
            <h2>迁跃</h2>
            <p>点地点前往。安全区受庇护，野外可动手。</p>
            <div class="search" style="margin-top:10px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
              <input id="locQ" type="search" placeholder="搜索地点" aria-label="搜索地点" />
            </div>
          </div>
          <div class="sidebar-list" id="locList"></div>
        </aside>

        <div class="stage-wrap">
          <main class="stage">
            <div class="stage-head">
              <h2 id="viewTitle">同场修士</h2>
              <span class="sub" id="viewSub">点人打开交谈玉简</span>
              <div class="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                <input id="listQ" type="search" placeholder="筛选" aria-label="筛选列表" />
              </div>
              <button type="button" class="btn sm" id="btnRefresh">刷新</button>
            </div>
            <div class="body-scroll" id="body" aria-live="polite"></div>
          </main>

          <footer class="console">
            <div id="suggest" class="suggest hidden" role="listbox"></div>
            <form id="cmdForm" class="console-row">
              <span class="console-tag" id="cmdTag">敕令</span>
              <span class="busy-dot" id="busyDot" aria-hidden="true"></span>
              <input id="cmdInput" type="text" maxlength="200"
                     placeholder="/ 搜索指令，或直接说话（交谈中）"
                     aria-label="敕令输入" />
              <button type="submit" class="btn primary" id="cmdGo">行</button>
            </form>
            <div class="busy-line" id="busyLine" role="status">天道正在裁决</div>
            <div class="console-hint">
              <span><kbd>/</kbd> 模糊指令</span>
              <span><kbd>Ctrl+K</kbd> 聚焦</span>
              <span><kbd>Esc</kbd> 关闭</span>
              <span id="cmdTarget">未锁定交谈</span>
            </div>
          </footer>
        </div>
      </div>
    </div>
  </div>

  <!-- 交谈玉简 -->
  <div id="chatModal" class="modal hidden" aria-hidden="true" role="dialog" aria-labelledby="chatTitle">
    <div class="slab">
      <div class="slab-head">
        <div style="flex:1;min-width:0">
          <h2 id="chatTitle">交谈</h2>
          <p id="chatSub">在下方直接说话；买卖与动作由规则结算</p>
        </div>
        <button type="button" class="icon-btn" id="chatClose" data-close-chat="1" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="slab-log" id="chatLog" aria-live="polite"></div>
      <form id="chatForm" class="slab-form">
        <span class="busy-dot" id="chatBusy" aria-hidden="true"></span>
        <input id="chatInput" type="text" maxlength="200" autocomplete="off"
               placeholder="说点什么…（回车发送）" aria-label="发言" />
        <button type="submit" class="btn primary" id="chatSend">发送</button>
      </form>
      <div class="slab-foot">
        <button type="button" class="btn sm" id="btnChatMem">会话记忆</button>
        <button type="button" class="btn sm" id="btnChatHang" data-close-chat="1">挂断并关闭</button>
        <button type="button" class="btn sm" data-close-chat="1">关闭</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="workbench.js"></script>
  <!-- 弹窗关闭兜底：即使主脚本绑定失败也能关掉 -->
  <script>
    (function () {
      function hideChat() {
        var m = document.getElementById("chatModal");
        if (!m) return;
        m.classList.add("hidden");
        m.style.display = "none";
        m.style.visibility = "hidden";
        m.style.pointerEvents = "none";
        m.setAttribute("aria-hidden", "true");
      }
      document.addEventListener("click", function (e) {
        var t = e.target;
        if (!t || !t.closest) return;
        if (t.closest("[data-close-chat]") || t.closest("#chatClose") || t.closest("#btnChatHang")) {
          hideChat();
        }
        var m = document.getElementById("chatModal");
        if (m && t === m) hideChat();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") hideChat();
      });
    })();
  </script>
</body>
</html>
