<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>天道因果录 · 灵蕴玄枢</title>
  <meta name="description" content="水墨翡翠白玉仙侠修仙模拟工作台" />
  <link rel="stylesheet" href="workbench.css" />
</head>
<body>
  <!-- 入世门庭 -->
  <div id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-hero">
        <div class="gate-seal">道</div>
        <h1>天道因果录</h1>
        <p>修仙模拟 · 灵蕴玄枢</p>
      </div>
      <div class="gate-body">
        <div class="gate-tabs">
          <button type="button" class="tab active" data-mode="login">登临道界</button>
          <button type="button" class="tab" data-mode="register">初入仙途</button>
        </div>
        <form id="gateForm" autocomplete="on">
          <div class="field">
            <label for="fUser">仙籍账号</label>
            <input id="fUser" type="text" autocomplete="username" required maxlength="32" placeholder="输入仙籍账号，例如 散修道友" />
          </div>
          <div class="field hidden" id="fNameWrap">
            <label for="fName">本命道号</label>
            <input id="fName" type="text" maxlength="12" placeholder="踏入仙途名号" />
          </div>
          <div class="field">
            <label for="fPass">神识密匙</label>
            <input id="fPass" type="password" autocomplete="current-password" required maxlength="64" placeholder="输入入世密匙" />
          </div>
          <div class="field">
            <label for="fServer">宗门阵枢</label>
            <input id="fServer" type="text" placeholder="http://127.0.0.1:8765" spellcheck="false" />
          </div>
          <div id="gateMsg" class="gate-msg" role="alert"></div>
          <div class="gate-actions">
            <button type="submit" class="btn primary block" id="gateSubmit">踏入大千世界</button>
            <button type="button" class="btn secondary block" id="btnProbe">感应阵枢灵脉</button>
            <button type="button" class="btn ghost block" id="btnDemo">玄黄镜演（离线演示）</button>
          </div>
        </form>
        <div class="gate-foot">
          启阵：<code>python -m server.run</code><br />
          阵枢灵脉：<code>http://127.0.0.1:8765/</code>
        </div>
      </div>
    </div>
  </div>

  <!-- 仙门工作台主天道视界 -->
  <div id="app" class="app hidden">
    <!-- 顶部全局仙门中枢与天道盘 -->
    <header class="header-bar">
      <div class="brand-seal">
        <div class="brand-mark">道</div>
        <div>
          <div class="brand-title">天道因果录</div>
          <div class="brand-sub">灵蕴玄枢</div>
        </div>
      </div>

      <!-- 四大核心主循环切页导航 -->
      <nav class="main-nav" aria-label="仙途主境导航">
        <button type="button" class="nav-tab active" data-view="sanctum">
          <span class="nav-tab-dot"></span>玄阁洞府
        </button>
        <button type="button" class="nav-tab" data-view="wilderness">
          <span class="nav-tab-dot"></span>十方大荒
        </button>
        <button type="button" class="nav-tab" data-view="inventory">
          <span class="nav-tab-dot"></span>百宝纳戒
        </button>
        <button type="button" class="nav-tab" data-view="bazaar">
          <span class="nav-tab-dot"></span>九霄坊市
        </button>
      </nav>

      <!-- 顶部修士道行与灵资信息盘 -->
      <div class="user-dial">
        <div class="dial-item">
          <span class="k">本命道号</span>
          <span class="v gold" id="topDaoName">—</span>
        </div>
        <div class="dial-item">
          <span class="k">境界阶位</span>
          <span class="v" id="topDaoRealm">—</span>
        </div>
        <div class="dial-item">
          <span class="k">随身灵石</span>
          <span class="v gold" id="topStones">—</span>
        </div>
        <div class="dial-item">
          <span class="k">所在天地</span>
          <span class="v" id="topLocation">—</span>
        </div>

        <button type="button" class="drawer-trigger-btn" id="btnOpenDrawer" title="同场仙友与十方九地">
          <span>同场神识</span>
          <span class="card-tag" id="topHereCount" style="margin-left:4px">0</span>
        </button>

        <button type="button" class="btn ghost sm" id="btnTheme" title="天象昼夜切换">天象</button>
        <button type="button" class="btn ghost sm" id="btnLogout" title="暂离大千世界">归隐</button>
      </div>
    </header>

    <!-- 主视窗工作区（四大主境画卷） -->
    <main class="main-stage" id="mainStage">
      <div id="stageContent"></div>
    </main>

    <!-- 右侧滑入式神识浮匣（同场仙友与十方迁跃） -->
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="side-drawer" id="sideDrawer" aria-label="同场仙友神识匣">
      <div class="drawer-head">
        <div>
          <h3>神识感应 · 同场仙友</h3>
          <p id="drawerLocSub" style="font-size:12px;color:var(--ink-500)">周遭同道与十方天地</p>
        </div>
        <button type="button" class="btn ghost sm" id="btnCloseDrawer">收束</button>
      </div>
      <div class="drawer-tabs">
        <button type="button" class="tab active" id="tabCultivators">周遭修士</button>
        <button type="button" class="tab" id="tabTeleport">十方迁跃</button>
      </div>
      <div class="drawer-body" id="drawerBody">
        <!-- 动态渲染：周遭修士 / 十方九地一键迁跃 -->
      </div>
    </aside>

    <!-- 底部神识敕令控制台 -->
    <footer class="console-bar">
      <span class="console-tag" id="cmdTag">神识敕令</span>
      <div class="console-input-wrap">
        <div class="suggest-box hidden" id="suggest" role="listbox"></div>
        <form id="cmdForm" style="display:flex;width:100%;align-items:center;gap:10px;">
          <span class="busy-dot" id="busyDot" aria-hidden="true"></span>
          <input class="console-input" id="cmdInput" type="text" maxlength="200"
                 placeholder="输入「/」唤起神识敕令，或直接输入言语传音…"
                 aria-label="神识敕令" autocomplete="off" />
          <button type="submit" class="btn primary console-submit" id="cmdGo">敕令疾行</button>
        </form>
      </div>
      <div class="console-hint" id="consoleHint">
        <span>【斜杠】唤起敕令</span>
        <span>【回车】神识疾行</span>
        <span>【定神】关闭浮窗</span>
        <span id="cmdTarget">未锁定同道</span>
      </div>
    </footer>
  </div>

  <!-- 神识交谈玉简 -->
  <div id="chatModal" class="modal hidden" aria-hidden="true" role="dialog" aria-labelledby="chatTitle">
    <div class="slab">
      <div class="slab-head">
        <div style="flex:1;min-width:0">
          <h2 id="chatTitle">神识交谈</h2>
          <p id="chatSub">直接向对方传音言语；买卖与动作由天道权威裁决结算</p>
        </div>
        <button type="button" class="btn ghost sm" id="chatClose" data-close-chat="1" aria-label="收束传音">收束</button>
      </div>
      <div class="slab-log" id="chatLog" aria-live="polite"></div>
      <form id="chatForm" class="slab-form">
        <span class="busy-dot" id="chatBusy" aria-hidden="true"></span>
        <input id="chatInput" type="text" maxlength="200" autocomplete="off"
               placeholder="输入神识传音内容…（回车发信）" aria-label="发言" />
        <button type="submit" class="btn primary" id="chatSend">传音</button>
      </form>
      <div class="slab-foot">
        <button type="button" class="btn sm secondary" id="btnChatMem">观照因果记忆</button>
        <button type="button" class="btn sm secondary" id="btnChatHang" data-close-chat="1">断开神识</button>
        <button type="button" class="btn sm ghost" data-close-chat="1">收束</button>
      </div>
    </div>
  </div>

  <!-- 全局天道提示浮层 -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="workbench.js"></script>
  <!-- 弹窗关闭兜底：防止任何事件阻断导致的遮罩卡死 -->
  <script>
    (function () {
      function hideChat() {
        var m = document.getElementById("chatModal");
        if (!m) return;
        m.classList.add("hidden");
        m.setAttribute("aria-hidden", "true");
      }
      document.addEventListener("click", function (e) {
        var t = e.target;
        if (!t || !t.closest) return;
        if (t.closest("[data-close-chat]") || t.closest("#chatClose") || t.closest("#btnChatHang")) {
          hideChat();
        }
        var m = document.getElementById("chatModal");
        if (m && t === m) hideChat();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") hideChat();
      });
    })();
  </script>
</body>
</html>
